# Exercises the template branches no other permutation reaches: the ServiceMonitor, the
# PrometheusRule, the dashboard ConfigMap, the unprivileged-port sysctl, the read-only controller,
# and the admin liveness probe.
replicaCount: 1
privilegedPorts: sysctl
readOnly: true
# The only permutation on the `admin` branch: every other one keeps the default tcpSocket on http.
livenessPort: admin
extraArgs: ["--log-level=gapura=debug"]
extraEnv:
  - name: RUST_BACKTRACE
    value: "1"
metrics:
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    labels: { release: kube-prometheus-stack }
  dashboard:
    enabled: true
  prometheusRule:
    enabled: true
    labels: { release: kube-prometheus-stack }
