# The console behind a private registry: the top-level imagePullSecrets reach the console's pod
# as well as the gateway's (#231). Local users rendered by the chart, so the pod also carries the
# users file's checksum that rolls it when they change (#230).
imagePullSecrets:
  - name: ghcr
console:
  enabled: true
  auth:
    local:
      users:
        - email: admin@example.test
          bcryptHash: "$2b$10$abcdefghijklmnopqrstuvC9LdVZ0iJPT8fB4t1S0YwJxQ2uHq3z"
          groups: ["admins"]
  grants: ["admins=*"]
  sessionKey:
    existingSecret: gapura-console-session
