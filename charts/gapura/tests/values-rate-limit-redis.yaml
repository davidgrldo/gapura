# Request limits counted in Redis, with its password and CA from Secrets and a timeout, for the
# Kubernetes gateway and for a data plane: the flags, the Secret volumes and their mounts render in
# both Deployments.
rateLimit:
  redis:
    url: rediss://redis.cache.svc:6380/0
    password:
      existingSecret: redis-auth
    ca:
      existingSecret: redis-ca
      key: ca.pem
    timeoutMs: 25
dataPlane:
  enabled: true
  replicaCount: 1
  controlPlane:
    url: http://127.0.0.1:18081
    insecureHttp: true
    token:
      existingSecret: edge-token
