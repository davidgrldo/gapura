# Source: gapura/templates/service-admin.yaml
# Admin port on its own ClusterIP Service: /metrics and /debug/config must never be reachable
# from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: gapura-admin
  namespace: gapura-system
  labels:
    helm.sh/chart: gapura-0.1.0
    app.kubernetes.io/name: gapura
    app.kubernetes.io/instance: gapura
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gapura
    # Own label instead of overriding app.kubernetes.io/component, which gapura.labels already sets.
    gapura.dev/admin: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gapura
    app.kubernetes.io/instance: gapura
    app.kubernetes.io/component: gateway
  ports:
  - name: admin
    port: 9090
    targetPort: admin
    protocol: TCP
---
