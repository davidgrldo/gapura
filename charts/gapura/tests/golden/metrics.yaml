      app.kubernetes.io/name: gapura
      app.kubernetes.io/instance: gapura
      app.kubernetes.io/component: smoke-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gapura
        app.kubernetes.io/instance: gapura
        app.kubernetes.io/component: smoke-backend
        gapura.dev/smoke: "true"
    spec:
      containers:
      - name: echo
        # The same echo backend deploy/kind/fixture.yaml uses.
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: [netexec, --http-port=8080]
        ports: [{ containerPort: 8080, name: http }]
---
# Source: gapura/templates/smoke-test.yaml
# `helm test` fixture: one throwaway Gateway, HTTPRoute and echo backend, plus a curl pod that
# proves a request routes through the data plane of this release. Everything here is a hook
# (`helm.sh/hook: test`), so none of it exists at install time; `helm test` creates it, waits for
# the curl pod, and deletes it again (`before-hook-creation,hook-succeeded`: a failed run leaves
# the resources behind for debugging, the next run cleans them up first).
#
# The curl pod carries hook-weight 1 and runs after the weight-0 resources: helm waits for the
# backend Deployment to report Available before starting it. The retry loop in the curl command
# covers the remaining race, the config swap reaching the data plane, which no readiness gate can
# see. The request goes to the chart's Service by its ClusterIP DNS name, so the smoke test works
# for every service.type and never depends on a LoadBalancer or a published address.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gapura-smoke
  namespace: gapura-system
  labels:
    helm.sh/chart: gapura-0.1.0
    app.kubernetes.io/name: gapura
    app.kubernetes.io/instance: gapura
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gapura
    gapura.dev/smoke: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  gatewayClassName: gapura
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes: { namespaces: { from: Same } }
---
# Source: gapura/templates/smoke-test.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gapura-smoke
  namespace: gapura-system
  labels:
    helm.sh/chart: gapura-0.1.0
    app.kubernetes.io/name: gapura
    app.kubernetes.io/instance: gapura
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gapura
    gapura.dev/smoke: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  parentRefs: [{ name: gapura-smoke }]
  hostnames: ["gapura-smoke.local"]
  rules:
  - backendRefs: [{ name: gapura-smoke-backend, port: 80 }]
