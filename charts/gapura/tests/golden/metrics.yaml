# Source: gapura/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gapura
  namespace: gapura-system
  labels:
    helm.sh/chart: gapura-0.1.0
    app.kubernetes.io/name: gapura
    app.kubernetes.io/instance: gapura
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gapura
    release: kube-prometheus-stack
spec:
  groups:
  - name: gapura
    rules:
    - alert: GapuraNoLeader
      annotations:
        description: Gateway API status stops being written, while traffic keeps flowing.
        summary: No Gapura replica holds the Lease
      expr: sum(gapura_leader) == 0
      for: 5m
      labels:
        severity: warning
    - alert: GapuraConfigReloadFailing
      annotations:
        description: The previous config is still being served; the logs carry the translator
          error.
        summary: Gapura config reloads are failing
      expr: increase(gapura_config_reloads_total{result="failure"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
    - alert: GapuraUpstreamErrors
      annotations:
        description: 'Ratio of upstream error attempts (gapura_upstream_errors_total,
          counted once per failed connect or read attempt) to every request that reached
          logging (gapura_requests_total, which also counts route-miss 404s, locally
          generated 5xx and client aborts logged as status 0). It is not a request failure
          rate and is not bounded by 1: a request that fails over to another endpoint
          and then returns 200 still contributes an error, and one request can contribute
          several. Read it as a signal of upstream trouble, then check the user-visible
          impact with gapura_requests_total by code.'
        summary: Upstream error attempts exceed 5 per 100 Gapura requests
      expr: |
        sum(rate(gapura_upstream_errors_total[5m]))
          / clamp_min(sum(rate(gapura_requests_total[5m])), 0.001) > 0.05
      for: 10m
      labels:
        severity: critical
    - alert: GapuraTlsSniMisses
      annotations:
        summary: TLS handshakes arrive with an SNI no listener serves
      expr: sum(rate(gapura_tls_sni_misses_total[15m])) > 0
      for: 15m
      labels:
        severity: info
