# Source: gapura/templates/smoke-test.yaml
apiVersion: v1
kind: Pod
metadata:
  name: gapura-smoke-curl
  namespace: gapura-system
  labels:
    helm.sh/chart: gapura-0.2.0
    app.kubernetes.io/name: gapura
    app.kubernetes.io/instance: gapura
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gapura
    app.kubernetes.io/component: smoke
    gapura.dev/smoke: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: curl
    image: curlimages/curl:8.11.1
    command: ["/bin/sh", "-c"]
    args:
    - |
      set -eu
      url="http://gapura.gapura-system.svc:80/echo?msg=helm-smoke"
      out=""
      for i in $(seq 30); do
        if out=$(curl -sS --fail-with-body --max-time 5 -H 'Host: gapura-smoke.local' "$url"); then
          case "$out" in
            *helm-smoke*) echo "SMOKE OK: request routed through this release's data plane: $out"; exit 0 ;;
          esac
          echo "unexpected body, retrying: $out" >&2
        fi
        sleep 2
      done
      echo "SMOKE FAILED: no routed answer after 30 tries; last response: ${out:-<none>}" >&2
      exit 1
