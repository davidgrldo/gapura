apiVersion: apps/v1
kind: Deployment
metadata:
  name: gapura-control
  namespace: gapura-system
  labels:
    helm.sh/chart: gapura-0.2.0
    app.kubernetes.io/name: gapura
    app.kubernetes.io/instance: gapura
    app.kubernetes.io/component: gateway
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gapura
    app.kubernetes.io/component: console
spec:
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gapura
      app.kubernetes.io/instance: gapura
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gapura
        app.kubernetes.io/instance: gapura
        app.kubernetes.io/component: console
    spec:
      serviceAccountName: gapura-control
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: control
        image: ghcr.io/davidgrldo/gapura-control:0.2.0
        imagePullPolicy: IfNotPresent
        args:
        - --listen=0.0.0.0:8080
        - --auth-mode=oidc
        - --gateway-admin=http://gapura-admin.gapura-system.svc:9090
        - --controller-name=gapura.dev/controller
        - --session-lifetime-seconds=3600
        - --log-level=info
        - --grant=platform=platform
        - --grant=sre=*
        - --oidc-issuer=https://id.example.com/realms/engineering
        - --oidc-client-id=gapura-console
        - --oidc-redirect-url=https://console.example.test/auth/callback
        - --oidc-groups-claim=groups
        - --oidc-scope=email
        env:
        - name: GAPURA_SESSION_KEY
          valueFrom:
            secretKeyRef:
              name: gapura-console-session
              key: session-key
        - name: GAPURA_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: gapura-console-oidc
              key: client-secret
        ports:
        - name: http
          containerPort: 8080
        livenessProbe:
          httpGet: { path: /healthz, port: http }
        readinessProbe:
          httpGet: { path: /healthz, port: http }
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
