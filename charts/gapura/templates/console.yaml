{{- if ((.Values.console).enabled) }}
{{- $mode := (((.Values.console).auth).mode) | default "local" }}
{{- if not (has $mode (list "local" "oidc")) }}
{{- fail (printf "console.auth.mode must be local or oidc, got %q" $mode) }}
{{- end }}
{{- $localUsers := (((.Values.console).auth).local).users | default list }}
{{- if and (eq $mode "local") (not (((.Values.console).auth).local).existingSecret) (eq (len $localUsers) 0) }}
{{- fail "console.auth.mode local with no console.auth.local.users: a console nobody can log into is the failure this catches" }}
{{- end }}
{{- $usersSecret := "" }}
{{- if eq $mode "local" }}
{{- $usersSecret = ((((.Values.console).auth).local).existingSecret) | default (printf "%s-control-users" (include "gapura.fullname" .)) }}
{{- if not ((((.Values.console).auth).local).existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $usersSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gapura.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
type: Opaque
stringData:
  users.yaml: |
    users:
{{- range $localUsers }}
      - email: {{ .email }}
        bcrypt: {{ .bcryptHash }}
        groups:
{{- if .groups }}
{{- range .groups }}
        - {{ . }}
{{- end }}
{{- else }}
        []
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $port := int (((.Values.console).service).port | default 8080) }}
{{- if and (ne .Values.privilegedPorts "capability") (ne .Values.privilegedPorts "sysctl") (lt $port 1024) }}
{{- fail (printf "console.service.port %d is below 1024 and the nonroot console cannot bind it: raise the port, or set privilegedPorts to capability or sysctl" $port) }}
{{- end }}
{{- $fullname := include "gapura.fullname" . }}
# The console: gapura-control, its own workload. Deliberately a separate Deployment,
# ServiceAccount and RBAC from the data plane (#63): it holds cluster read credentials and
# terminates OIDC, the data plane faces the internet, and neither should carry the other's
# powers. Off by default -- it needs an identity provider configured before it does
# anything, and an install that silently starts a pod nobody can log into is worse than one
# that waits to be asked.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gapura.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
{{- if ((.Values.console).rbac.create) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-control
  labels:
    {{- include "gapura.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
rules:
  # What kube_source reads: HTTPRoutes across every namespace, because the console scopes
  # what it shows by the caller's grants, not by the API server's. The data plane's role is
  # broader (watches ten kinds and writes status); this one reads exactly one.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-control
  labels:
    {{- include "gapura.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-control
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-control
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gapura.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ ((.Values.console).service.type) }}
  selector:
    app.kubernetes.io/name: {{ include "gapura.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
  ports:
  - name: http
    port: {{ ((.Values.console).service.port) }}
    targetPort: http
    {{- if and (eq ((.Values.console).service.type) "NodePort") (((.Values.console).service.nodePort)) }}
    nodePort: {{ ((.Values.console).service.nodePort) }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gapura.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  {{- if not ((.Values.console).updateStrategy) }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  {{- end }}
  replicas: {{ ((.Values.console).replicaCount) }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gapura.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gapura.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: console
    spec:
      serviceAccountName: {{ $fullname }}-control
      {{- if eq $mode "local" }}
      volumes:
      - name: users
        secret: { secretName: {{ $usersSecret }} }
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
        {{- if and (eq .Values.privilegedPorts "sysctl") (lt $port 1024) }}
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
        {{- end }}
      containers:
      - name: control
        image: {{ include "gapura.consoleImage" . }}
        imagePullPolicy: {{ ((.Values.console).image.pullPolicy) }}
        args:
        - --listen=0.0.0.0:{{ ((.Values.console).service).port | default 8080 }}
        - --auth-mode={{ $mode }}
        {{- if eq $mode "local" }}
        - --local-users-file=/etc/gapura-control/users.yaml
        {{- end }}
        - --gateway-admin=http://{{ $fullname }}-admin.{{ .Release.Namespace }}.svc:{{ .Values.ports.admin }}
        - --controller-name={{ .Values.controllerName }}
        - --session-lifetime-seconds={{ ((.Values.console).sessionLifetimeSeconds) }}
        - --log-level={{ ((.Values.console).logLevel) }}
        {{- range ((.Values.console).grants) }}
        - --grant={{ . }}
        {{- end }}
        {{- if eq $mode "oidc" }}
        - --oidc-issuer={{ ((.Values.console).oidc).issuer }}
        - --oidc-client-id={{ ((.Values.console).oidc).clientId }}
        - --oidc-redirect-url={{ ((.Values.console).oidc).redirectUrl }}
        - --oidc-groups-claim={{ (((.Values.console).oidc).groupsClaim) | default "groups" }}
        {{- range (((.Values.console).oidc).scopes) }}
        - --oidc-scope={{ . }}
        {{- end }}
        {{- end }}
        env:
        - name: GAPURA_SESSION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ ((.Values.console).sessionKey.existingSecret) }}
              key: {{ ((.Values.console).sessionKey.key) }}
        {{- if eq $mode "oidc" }}
        - name: GAPURA_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ ((.Values.console).oidc.existingSecret) }}
              key: {{ ((.Values.console).oidc.clientSecretKey) }}
        {{- end }}
        {{- if eq $mode "local" }}
        volumeMounts:
        - { name: users, mountPath: /etc/gapura-control, readOnly: true }
        {{- end }}
        ports:
        - name: http
          containerPort: {{ ((.Values.console).service.port) }}
        livenessProbe:
          httpGet: { path: /healthz, port: http }
        readinessProbe:
          httpGet: { path: /healthz, port: http }
        resources: {{- toYaml ((.Values.console).resources) | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            {{- if and (eq .Values.privilegedPorts "capability") (lt $port 1024) }}
            add: ["NET_BIND_SERVICE"]
            {{- end }}
{{- end }}
