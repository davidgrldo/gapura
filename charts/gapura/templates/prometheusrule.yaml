{{- if .Values.metrics.prometheusRule.enabled }}
{{- $rule := .Files.Get "prometheus-rule.yaml" }}
{{- if not $rule }}
{{- fail "metrics.prometheusRule.enabled is true but charts/gapura/prometheus-rule.yaml is missing" }}
{{- end }}
{{- $parsed := $rule | fromYaml }}
{{- if not (kindIs "map" $parsed.spec) }}
{{- fail (printf "charts/gapura/prometheus-rule.yaml has no spec map (parsed .spec is %s): the file is either not valid YAML or is missing its top-level spec key" (kindOf $parsed.spec)) }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gapura.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gapura.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec: {{- toYaml $parsed.spec | nindent 2 }}
{{- end }}
