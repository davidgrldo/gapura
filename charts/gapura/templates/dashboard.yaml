{{- if ((.Values.metrics).dashboard).enabled }}
{{- $json := .Files.Get "dashboards/gapura-overview.json" }}
{{- if not $json }}
{{- fail "metrics.dashboard.enabled is true but charts/gapura/dashboards/gapura-overview.json is missing" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gapura.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gapura.labels" . | nindent 4 }}
    {{ ((.Values.metrics).dashboard).label }}: {{ ((.Values.metrics).dashboard).labelValue | quote }}
data:
  gapura-overview.json: |
{{ $json | indent 4 }}
{{- end }}
