{{- if .Values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels: {{- include "gapura.labels" . | nindent 4 }}
  {{- with .Values.gatewayClass.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  controllerName: {{ .Values.controllerName }}
{{- end }}
