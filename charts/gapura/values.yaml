# Number of replicas. Every replica watches the API server and serves traffic; only the holder
# of the Lease writes Gateway API status.
replicaCount: 2

image:
  repository: ghcr.io/davidgrldo/gapura
  # Defaults to the chart appVersion.
  tag: ""
  # Pin the image by digest instead: takes precedence over tag, so the release runs byte-for-byte
  # the image CI pushed. Use the manifest-list digest (RELEASING 5.1 shows how to read it), not a
  # single-platform one, or only that platform's nodes can pull.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# GatewayClass.spec.controllerName this instance handles. Must match the GatewayClass below.
# The gapura.dev prefix is the project's identity, not the publisher's: Kubernetes only requires a
# DNS-subdomain shape here, and changing this string after a release orphans every GatewayClass
# that still names the old controller.
controllerName: gapura.dev/controller

# The GatewayClass is cluster-scoped, so its name must be unique in the cluster: a second release
# of this chart needs its own `gatewayClass.name` and its own `controllerName`, or the two
# installations fight over the same class.
gatewayClass:
  create: true
  name: gapura
  annotations: {}

# Container ports. These are also the Gateway listener ports a Gateway may declare: a listener on
# any other port gets Accepted=False, reason PortUnavailable.
ports:
  http: 80
  https: 443
  admin: 9090

# Which port the liveness probe watches. `http` catches a data-plane listener that died, which no
# probe on the admin port can see, though a TCP probe on `http` cannot see an https-only failure.
# A listener that never bound at all needs no probe: the process exits 1 before any probe runs.
# `admin` watches only the admin thread.
livenessPort: http

# Additional plain-HTTP sockets each replica binds at startup, besides ports.http. These are
# the pool the translator remaps colliding listeners onto (an address per Gateway): when two
# Gateways' routes would tie on one port, the later one moves to a free bound port, so give
# every colliding Gateway a port here and a Service (or LoadBalancer address) pointing at it.
# HTTPS equivalent: extraListenHttps. Empty keeps a single-socket deployment.
extraListenHttp: []
extraListenHttps: []
# Per-Gateway status addresses, keyed `namespace/name`, as a list of IPs or hostnames. A
# Gateway named here gets exactly these in `status.addresses`; every other Gateway keeps
# publishAddresses. Pair with extraListenHttp so each address reaches its own Gateway.
gatewayAddresses: {}

service:
  type: LoadBalancer
  annotations: {}
  labels: {}
  # Empty means the cluster default.
  loadBalancerClass: ""
  loadBalancerIP: ""
  # Local preserves the client's source address; a multi-node cluster then answers the NodePort
  # only on nodes running a gateway replica, which is the honest default for a proxy that logs
  # and routes on that address. Cluster spreads it to every node at the cost of an extra hop and
  # a source address the backend cannot trust.
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  # Only used when type is NodePort.
  nodePorts:
    http: null
    https: null

# Extra addresses published into Gateway status, on top of the LoadBalancer addresses of the
# Service. Needed on clusters without a LoadBalancer implementation (kind).
publishAddresses: []
# Publish the LoadBalancer addresses of this chart's Service (--publish-service).
publishService: true

# Networks whose X-Forwarded-For the access log believes, as CIDRs or bare addresses. Leave this
# empty and the header is ignored, so client_ip in the access log is whatever opened the
# connection -- which behind an ingress, a service mesh or a CDN is that proxy rather than the
# visitor. Set it to the networks those proxies connect from, and nothing else: any caller may
# write this header, and every network listed here is one whose word is taken for it.
trustedProxies: []

# Request headers naming the client by a single IP (the flag is --trusted-client-header), e.g.
# CF-Connecting-IP behind a Cloudflare tunnel or X-Real-IP behind nginx. Believed only when the
# peer is a trustedProxies network and the request carries no X-Forwarded-For chain -- the shape
# of a CDN tunnel that names the client nowhere else. Order matters: the first header present on
# a request wins.
trustedClientHeaders: []

# Include the request's query string in the access log (the flag is --access-log-query). Off by
# default: query strings carry tokens and other secrets, and an access log is written to be
# read. Turn it on when a log line has to name the exact request, not just its path -- the field
# is `query`, and `path` never carries it.
accessLog:
  query: false

# EnvFilter directives, e.g. "info" or "gapura=debug". Pingora logs every failed downstream
# handshake at error level, including the ones a port scanner causes, so it is quieted by default.
logLevel: info,pingora_core::services::listening=warn
# Worker threads per Pingora service. 0 asks the machine, which does not see cgroup limits, so on
# a large node it means many threads inside a small memory limit. Set it to your CPU limit.
threads: 0
# Do not write status and never take the Lease.
readOnly: false
extraArgs: []
extraEnv: []

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

# With `create: false` the chart installs no ClusterRole, ClusterRoleBinding, Role or RoleBinding:
# bind your own to the ServiceAccount above. Without permissions the controller never loads a
# config, so its pods stay NotReady (they do not crash: the logs keep telling you why).
rbac:
  create: true

# How the container is allowed to bind ports below 1024 as uid 65532.
# capability: add NET_BIND_SERVICE (Pod Security Standard Restricted allows exactly this one).
# sysctl: set net.ipv4.ip_unprivileged_port_start=0 (a "safe" sysctl, incompatible with hostNetwork).
# none: neither, only for ports above 1023.
privilegedPorts: capability

updateStrategy:
  maxUnavailable: 0
  maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Pingora sleeps grace_period_seconds (30 s) then drains for up to graceful_shutdown_timeout_seconds
# (30 s), so anything below ~65 s means Kubernetes SIGKILLs the pod mid-drain.
terminationGracePeriodSeconds: 75

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: ""
    labels: {}
  dashboard:
    # Ship the Grafana dashboard as a ConfigMap for the Grafana sidecar to pick up.
    enabled: false
    label: grafana_dashboard
    labelValue: "1"
  prometheusRule:
    # Ship deploy/prometheus-rule.yaml's example alerts as a PrometheusRule.
    # Needs the Prometheus Operator CRDs.
    enabled: false
    labels: {}

# `helm test` fixture: a throwaway Gateway, HTTPRoute and echo backend, plus a curl pod that
# proves one request routes through this release's data plane. Hook resources: created by
# `helm test`, never at install; deleted on success, kept on failure for debugging.
tests:
  smoke:
    enabled: true

# The console (gapura-control): reads the cluster and serves the web UI to signed-in
# operators. Off by default -- it needs an identity provider before it does anything, and an
# install that silently starts a pod nobody can log into is worse than one that waits to be
# asked. When enabled it is its own Deployment with its own ServiceAccount and read-only
# ClusterRole: it holds credentials the internet-facing data plane must never have.
console:
  enabled: false
  image:
    repository: ghcr.io/davidgrldo/gapura-control
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  rbac:
    create: true
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  # `group=namespace` grants, e.g. ["platform=platform", "sre=*"]. The console shows a
  # namespace's routes to the groups granted it; the mapping is enforced server-side.
  grants: []
  # Seconds a sign-in lasts. Short by design: nothing is stored, so a session cannot be
  # revoked before it expires.
  sessionLifetimeSeconds: 3600
  logLevel: info
  # How sign-in works. `local` (default) is the IdP-less ArgoCD shape: users below, no
  # identity provider anywhere, a server-rendered form at /auth/login. `oidc` uses the
  # provider configured under console.oidc and ignores the users file.
  auth:
    mode: local
    # Local users; bcrypt hashes only, never passwords (generate with
    #   python3 -c "import bcrypt,sys; print(bcrypt.hashpw(sys.argv[1].encode(), bcrypt.gensalt(10)).decode())" 'password-anda'
    # ). Groups feed the same grants as OIDC groups do. Rendered into a Secret mounted as
    # the users file; give existingSecret to supply your own Secret with a `users.yaml` key.
    local:
      users: []
      existingSecret: ""
  # The OIDC provider that signs console users in (auth.mode: oidc). All four of issuer/clientId/redirectUrl
  # and the two secret references are required when console.enabled -- the chart renders
  # them verbatim; helm fails an enabled console that names no provider, which is the
  # honest failure next to a pod that starts and signs nobody in.
  oidc:
    issuer: ""
    clientId: ""
    redirectUrl: ""
    # The claim carrying the caller's groups, and the provider decides its shape: keycloak,
    # okta and friends send `groups` as a list; a provider whose user carries exactly one
    # identity (dex static users) may send a bare string -- read as one group. `email` is the
    # workable claim for dex's static logins, which send no groups at all.
    groupsClaim: groups
    # The scopes to ask for beyond openid. The connection that matters: a provider only puts a
    # claim in the ID token when the scope carrying it was requested, so whatever groupsClaim
    # names has to arrive -- dex sends email only under the email scope (a first sign-in with
    # scopes empty produced groups:0 and an empty console, with nothing saying why), keycloak
    # realms can require their groups scope, and some providers attach it to profile.
    scopes: []
    # Name of an existing Secret holding the client secret...
    existingSecret: ""
    clientSecretKey: client-secret
  # Name of an existing Secret holding the session-signing key (>= 32 bytes, base64
  # accepted). Not created by the chart: a key generated at install time would rotate on
  # every upgrade and sign every reader out of a console they were using.
  sessionKey:
    existingSecret: ""
    key: session-key
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
