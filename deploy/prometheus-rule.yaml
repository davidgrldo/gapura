# Example alerts for Gapura. The chart can ship these as a PrometheusRule
# (metrics.prometheusRule.enabled=true); the thresholds are starting points, not SLOs.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gapura
spec:
  groups:
  - name: gapura
    rules:
    # gapura_leader is an unlabelled per-replica gauge: the leader reports 1, every other
    # replica reports 0, so the sum is 0 exactly when nobody holds the Lease. Two caveats:
    # a read-only install never runs leader election, so this fires permanently there, and a
    # deployment scraped by nothing returns an empty vector, which never fires -- pair it with
    # an `up` or `absent()` alert.
    - alert: GapuraNoLeader
      expr: sum(gapura_leader) == 0
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: No Gapura replica holds the Lease
        description: Gateway API status stops being written, while traffic keeps flowing.
    # There is deliberately no staleness alert on gapura_config_last_reload_timestamp_seconds.
    # That gauge is set only when the config actually changes: the reconcile loop skips when
    # nothing is dirty, and a relist returning identical objects is not dirty. So it records the
    # last *change*, not the last successful check, and "no reload in N minutes" cannot be told
    # apart from "nothing changed" -- which is the steady state of a healthy gateway, so such an
    # alert latches on every quiet cluster. gapura_config_reloads_total has the same property (it
    # only counts reconciles that ran), so no expression over the metrics Gapura exports today
    # fixes this; a correct staleness alert would need a new heartbeat series, bumped on every
    # completed check even when the result is unchanged. GapuraConfigReloadFailing below covers
    # the real failure mode: reloads being attempted and failing.
    - alert: GapuraConfigReloadFailing
      expr: increase(gapura_config_reloads_total{result="failure"}[15m]) > 0
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: Gapura config reloads are failing
        description: The previous config is still being served; the logs carry the translator error.
    - alert: GapuraUpstreamErrors
      expr: |
        sum(rate(gapura_upstream_errors_total[5m]))
          / clamp_min(sum(rate(gapura_requests_total[5m])), 0.001) > 0.05
      for: 10m
      labels: { severity: critical }
      annotations:
        summary: Upstream error attempts exceed 5 per 100 Gapura requests
        description: >-
          Ratio of upstream error attempts (gapura_upstream_errors_total, counted once per failed
          connect or read attempt) to every request that reached logging (gapura_requests_total,
          which also counts route-miss 404s, locally generated 5xx and client aborts logged as
          status 0). It is not a request failure rate and is not bounded by 1: a request that
          fails over to another endpoint and then returns 200 still contributes an error, and one
          request can contribute several. Read it as a signal of upstream trouble, then check the
          user-visible impact with gapura_requests_total by code.
    - alert: GapuraTlsSniMisses
      expr: sum(rate(gapura_tls_sni_misses_total[15m])) > 0
      for: 15m
      labels: { severity: info }
      annotations:
        summary: TLS handshakes arrive with an SNI no listener serves
