[package]
name = "gapura-control"
description = "The gapura control plane: serves the console and reads on its behalf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
hmac = "0.12"
# Default features are the reqwest + rustls client this workspace already uses; no
# native-tls, so nothing drags OpenSSL in behind the gateway's back.
openidconnect = "4"
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Only the stub identity provider needs this, to stamp an ID token with an expiry.
# `openidconnect` already pulls it in, so it costs the build nothing new.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tower = "0.5"
