[package]
name = "gapura-control"
description = "The gapura control plane: serves the console and reads on its behalf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bcrypt = { workspace = true }
# Store-mode passwords. bcrypt stays for Kubernetes mode's users file, whose hashes operators
# already hold; argon2id is what new accounts get.
argon2 = "0.5"
base64 = { workspace = true }
clap = { workspace = true }
hmac = { workspace = true }
# Named only to select the API version `kube` compiles against; nothing here refers to it.
k8s-openapi = { workspace = true }
kube = { workspace = true }
# The console's content-type header for whatever `rust-embed` hands back; kept separate from
# rust-embed's own "mime-guess" feature so the mapping from path to MIME type is one explicit
# call in `assets.rs` rather than a cargo feature flag elsewhere.
mime_guess = "2"
# Default features are the reqwest + rustls client this workspace already uses; no
# native-tls, so nothing drags OpenSSL in behind the gateway's back.
openidconnect = "4"
rand = { workspace = true }
reqwest = { workspace = true }
# Bakes `web/dist` into the binary in release builds so the console ships as part of
# `gapura-control` rather than as a second artifact an operator has to remember to copy
# alongside it; in debug builds it reads the files from disk at runtime instead, which is what
# lets a console rebuilt after `cargo build` show up without recompiling the server.
rust-embed = "8"
deadpool-postgres = { workspace = true }
# TLS on the rustls stack reqwest and kube already compile: to the store (store/tls.rs) and for
# the configuration endpoint's own server; axum already compiles hyper-util.
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = "1"
gapura-core = { path = "../gapura-core" }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tokio-postgres = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Only the stub identity provider needs this, to stamp an ID token with an expiry.
# `openidconnect` already pulls it in, so it costs the build nothing new.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tower = { workspace = true }
rcgen = { workspace = true }
# `tests/jwt.rs` signs tokens with a key rcgen generates, to check what the compiled policy
# accepts; verifying is `gapura_core::jwt`'s.
jsonwebtoken = { workspace = true }
