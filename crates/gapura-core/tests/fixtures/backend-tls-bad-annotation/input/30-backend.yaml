apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: apps
  annotations: { gapura.dev/backend-tls: "true" }
spec:
  ports: [{ name: https, port: 443, targetPort: 8443 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: { name: echo-1, namespace: apps, labels: { kubernetes.io/service-name: echo } }
addressType: IPv4
endpoints: [{ addresses: [10.1.0.5], conditions: { ready: true } }]
ports: [{ name: https, port: 8443, protocol: TCP }]
