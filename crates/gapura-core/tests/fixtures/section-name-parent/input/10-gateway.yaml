apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: main, namespace: infra, generation: 1 }
spec:
  gatewayClassName: gapura
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes: { namespaces: { from: All } }
  - name: https
    port: 443
    protocol: HTTPS
    tls: { certificateRefs: [{ name: wildcard }] }
    allowedRoutes: { namespaces: { from: All } }
