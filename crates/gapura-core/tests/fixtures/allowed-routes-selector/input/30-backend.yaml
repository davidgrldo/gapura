apiVersion: v1
kind: Service
metadata: { name: echo, namespace: apps }
spec:
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: { name: echo-x7k2p, namespace: apps, labels: { kubernetes.io/service-name: echo } }
addressType: IPv4
endpoints:
- { addresses: [10.1.0.5], conditions: { ready: true } }
ports: [{ name: http, port: 8080, protocol: TCP }]
---
apiVersion: v1
kind: Service
metadata: { name: echo, namespace: other }
spec:
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: { name: echo-y1, namespace: other, labels: { kubernetes.io/service-name: echo } }
addressType: IPv4
endpoints:
- { addresses: [10.3.0.1], conditions: { ready: true } }
ports: [{ name: http, port: 8080, protocol: TCP }]
