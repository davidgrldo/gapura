apiVersion: v1
kind: Service
metadata: { name: shared, namespace: platform }
spec:
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: { name: shared-1, namespace: platform, labels: { kubernetes.io/service-name: shared } }
addressType: IPv4
endpoints:
- { addresses: [10.2.0.9], conditions: { ready: true } }
ports: [{ name: http, port: 8080, protocol: TCP }]
