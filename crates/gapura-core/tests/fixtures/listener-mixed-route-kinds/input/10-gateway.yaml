apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: main, namespace: infra, generation: 1 }
spec:
  gatewayClassName: gapura
  listeners:
  - name: mixed
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces: { from: All }
      kinds:
      - { kind: TCPRoute }
      - { kind: HTTPRoute }
  - name: only-bad
    port: 80
    protocol: HTTP
    hostname: bad.example.com
    allowedRoutes:
      namespaces: { from: All }
      kinds: [{ kind: TCPRoute }]
  - name: https-mixed
    port: 443
    protocol: HTTPS
    hostname: tls.example.com
    tls: { certificateRefs: [{ name: wildcard }] }
    allowedRoutes:
      namespaces: { from: All }
      kinds:
      - { kind: TCPRoute }
      - { kind: HTTPRoute }
