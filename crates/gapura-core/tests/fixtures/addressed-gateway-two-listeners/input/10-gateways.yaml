apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: gw, namespace: infra, generation: 1 }
spec:
  gatewayClassName: gapura
  listeners:
  - name: a
    hostname: a.example.com
    port: 80
    protocol: HTTP
    allowedRoutes: { namespaces: { from: All } }
  - name: b
    hostname: b.example.com
    port: 80
    protocol: HTTP
    allowedRoutes: { namespaces: { from: All } }
