apiVersion: v1
kind: Service
metadata: { name: echo, namespace: apps }
spec: { ports: [{ name: http, port: 80, targetPort: 8080 }] }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: { name: echo-m1r2o, namespace: apps, labels: { kubernetes.io/service-name: echo } }
addressType: IPv4
endpoints:
- { addresses: [10.1.0.5], conditions: { ready: true } }
ports: [{ name: http, port: 8080, protocol: TCP }]
---
apiVersion: v1
kind: Service
metadata: { name: shadow, namespace: apps }
spec: { ports: [{ name: http, port: 80, targetPort: 8180 }] }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: { name: shadow-m1r2o, namespace: apps, labels: { kubernetes.io/service-name: shadow } }
addressType: IPv4
endpoints:
- { addresses: [10.1.0.9], conditions: { ready: true } }
ports: [{ name: http, port: 8180, protocol: TCP }]
