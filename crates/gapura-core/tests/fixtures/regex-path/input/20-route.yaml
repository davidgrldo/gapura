# Rule indices deliberately run against the expected precedence: the regex rule comes first in
# the spec, so the sorted port table must visibly reorder Exact > PathPrefix > RegularExpression.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: mixed, namespace: apps, generation: 1, creationTimestamp: "2026-09-01T10:00:00Z" }
spec:
  parentRefs: [{ name: main, namespace: infra }]
  rules:
  - matches: [{ path: { type: RegularExpression, value: "^/api/.*" } }]
    backendRefs: [{ name: echo, port: 80 }]
  - matches: [{ path: { type: PathPrefix, value: /api } }]
    backendRefs: [{ name: echo, port: 80 }]
  - matches: [{ path: { type: Exact, value: /api } }]
    backendRefs: [{ name: echo, port: 80 }]
