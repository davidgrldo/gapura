apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: a-old, namespace: apps, generation: 1, creationTimestamp: "2026-01-01T00:00:00Z" }
spec:
  parentRefs: [{ name: main, namespace: infra }]
  rules:
  - matches: [{ path: { type: PathPrefix, value: /api } }]
    backendRefs: [{ name: echo, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: b-new, namespace: apps, generation: 1, creationTimestamp: "2026-06-01T00:00:00Z" }
spec:
  parentRefs: [{ name: main, namespace: infra }]
  rules:
  - matches:
    - path: { type: PathPrefix, value: /api }
      headers: [{ name: X-Version, value: "2" }]
    backendRefs: [{ name: echo, port: 80 }]
  - matches: [{ path: { type: Exact, value: /api/v1 } }]
    backendRefs: [{ name: echo, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: c-host, namespace: apps, generation: 1, creationTimestamp: "2026-08-01T00:00:00Z" }
spec:
  parentRefs: [{ name: main, namespace: infra }]
  hostnames: [api.example.com]
  rules:
  - matches: [{ path: { type: PathPrefix, value: / } }]
    backendRefs: [{ name: echo, port: 80 }]
