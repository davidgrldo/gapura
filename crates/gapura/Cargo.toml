[package]
name = "gapura"
description = "Gapura: Kubernetes Gateway API data plane on Pingora"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
gapura-core = { path = "../gapura-core" }
pingora = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
http = { workspace = true }
prometheus = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
futures = { workspace = true }
# ponytail: the mirror client is HTTP-only; TLS mirrors and body tee-ing are a follow-up.
reqwest = { workspace = true }
# `rust_crypto` rather than `aws_lc_rs`: jsonwebtoken 11 makes the provider an explicit choice,
# and this workspace already compiles OpenSSL from source for pingora. A second C crypto build
# would cost every image another toolchain for a few signature checks.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
axum = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
