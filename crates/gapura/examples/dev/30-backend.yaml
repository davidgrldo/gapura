apiVersion: v1
kind: Service
metadata: { name: files, namespace: dev }
spec: { ports: [{ name: http, port: 80, targetPort: 9900 }] }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: { name: files-local, namespace: dev, labels: { kubernetes.io/service-name: files } }
addressType: IPv4
endpoints: [{ addresses: ["127.0.0.1"], conditions: { ready: true } }]
ports: [{ name: http, port: 9900 }]
