# cargo-deny 0.20 configuration. Run: cargo deny check all
# Do not copy cargo-deny's own deny.toml: it bans openssl, openssl-sys and cmake, all of which
# Pingora requires (vendored OpenSSL, zlib-ng via cmake).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# Every advisory denies by default in this version; list exceptions in `ignore` with a reason.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = [
    # protobuf 2.28 crashes on deeply nested *input*. It reaches us through prometheus 0.13, which
    # pingora-core 0.8 also pins, so we cannot move off it on our own. Gapura only ever encodes
    # metrics (TextEncoder over the default registry) and never parses protobuf from any source,
    # so the vulnerable path is unreachable. Revisit when pingora bumps prometheus.
    { id = "RUSTSEC-2024-0437", reason = "we encode metrics, we never parse protobuf input" },
    # The Marvin attack recovers an RSA *private* key from the timing of operations that use one.
    # rsa 0.9 reaches us only through openidconnect, and gapura-control is an OIDC client: it
    # verifies ID token signatures with the provider's public key (rsa::RsaPublicKey::verify) and
    # never holds a private key of its own, so there is no secret for the sidechannel to leak.
    # openidconnect's own RSA signing path, CoreRsaPrivateSigningKey, needs a PEM we never supply.
    # Revisit if this crate ever signs anything with RSA, or if rsa ships a constant-time release.
    { id = "RUSTSEC-2023-0071", reason = "we verify with public keys and hold no RSA private key" },
]

[licenses]
confidence-threshold = 0.93
include-build = true
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",                  # ring is `Apache-2.0 AND ISC`; rustls-webpki and untrusted are ISC only
    "BSD-2-Clause",
    "BSD-3-Clause",         # zstd-sys, subtle, neli; `AND BSD-3-Clause` in encoding_rs and matchit
    "Zlib",                 # foldhash
    "Unicode-3.0",          # the ICU crates, and `AND Unicode-3.0` in unicode-ident
    "CDLA-Permissive-2.0",  # webpki-roots, webpki-root-certs
    "Unlicense",            # jiff, memchr, aho-corasick (all also offer MIT)
    "0BSD",
    "BSL-1.0",
]
exceptions = []

[bans]
# The graph has real duplicates today (openssl-probe 0.1/0.2, zstd 0.13/0.14, zstd-safe 7/8,
# r-efi 5/6, three windows-sys, two thiserror, two getrandom). Warn until they are triaged.
multiple-versions = "warn"
wildcards = "deny"
# `gapura-core = { path = "../gapura-core" }` has no version, which is right for a workspace member
# that is never published.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
