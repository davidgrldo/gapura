# cargo-deny 0.20 configuration. Run: cargo deny check all
# Do not copy cargo-deny's own deny.toml: it bans openssl, openssl-sys and cmake, all of which
# Pingora requires (vendored OpenSSL, zlib-ng via cmake).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
# Every advisory denies by default in this version; list exceptions in `ignore` with a reason.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = [
    # protobuf 2.28 crashes on deeply nested *input*. It reaches us through prometheus 0.13, which
    # pingora-core 0.8 also pins, so we cannot move off it on our own. Gapura only ever encodes
    # metrics (TextEncoder over the default registry) and never parses protobuf from any source,
    # so the vulnerable path is unreachable. Revisit when pingora bumps prometheus.
    { id = "RUSTSEC-2024-0437", reason = "we encode metrics, we never parse protobuf input" },
    # The Marvin attack recovers an RSA *private* key from the timing of operations that use one.
    # rsa 0.9 reaches us through openidconnect and through jsonwebtoken (its `rust_crypto`
    # provider, which gapura-core uses to verify JWTs for the data plane and to read a JWKS for the
    # control plane). Both only verify: gapura-control, as an OIDC client, checks ID token
    # signatures with the provider's public key, and gapura_core::jwt checks tokens against the
    # public keys of a JWKS. Nothing holds an RSA private key or signs with one, so there is no
    # secret for the sidechannel to leak. openidconnect's own RSA signing path,
    # CoreRsaPrivateSigningKey, needs a PEM we never supply, and jsonwebtoken's signing path is
    # never called with an RSA key (the tests sign with P-256). Revisit if anything here ever signs
    # with RSA, or if rsa ships a constant-time release.
    { id = "RUSTSEC-2023-0071", reason = "we verify with public keys and hold no RSA private key" },
    # crypto-bigint before 0.7.6 has secret-dependent branches in arithmetic meant to be
    # constant-time. 0.5 reaches us through elliptic-curve 0.13 (p256 and p384), which
    # jsonwebtoken's `rust_crypto` provider and openidconnect pin, and no 0.5 release carries the
    # fix. The leak is of the integers being computed on, and both paths only verify: ES256 and
    # ES384 signatures against a JWKS's or an OIDC provider's public keys, which are public. No
    # elliptic-curve private key is held or used outside the tests, which sign their own tokens.
    # Revisit when jsonwebtoken and openidconnect move to elliptic-curve 0.14, or if anything here
    # ever signs with an EC key.
    { id = "RUSTSEC-2026-0387", reason = "we verify ECDSA with public keys and hold no EC private key" },
    # zstd 0.13 and zstd-safe 7 have no fixed release, and pingora-header-serde 0.9.0 pins both
    # (so does Pingora's main branch); pingora-core's own zstd is on the fixed 0.14.3 / 8.2.0.
    # header-serde only compresses the response headers of pingora-cache's `CacheMeta`, and
    # Gapura never enables Pingora's HTTP cache, so none of its zstd code runs. Nor does it reach
    # the flawed calls if it ever did: it uses zstd for `zstd::dict` training and zstd-safe's
    # bulk `CCtx::compress` / `DCtx::decompress` (with and without a dictionary), never a stream
    # constructor's `with_context` (-0391) or `DCtx::decompress_stream` (-0403), and the
    # `seekable` feature (-0398) is off. Revisit when pingora-header-serde moves to zstd 0.14.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 under pingora-header-serde: no stream with_context, and the HTTP cache is off" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 under pingora-header-serde: the seekable feature is off" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 under pingora-header-serde: bulk decompress only, and the HTTP cache is off" },
]

[licenses]
confidence-threshold = 0.93
include-build = true
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",                  # ring is `Apache-2.0 AND ISC`; rustls-webpki and untrusted are ISC only
    "BSD-2-Clause",
    "BSD-3-Clause",         # zstd-sys, subtle, neli; `AND BSD-3-Clause` in encoding_rs and matchit
    "Zlib",                 # foldhash
    "Unicode-3.0",          # the ICU crates, and `AND Unicode-3.0` in unicode-ident
    "CDLA-Permissive-2.0",  # webpki-roots, webpki-root-certs
    "Unlicense",            # jiff, memchr, aho-corasick (all also offer MIT)
    "0BSD",
    "BSL-1.0",
]
exceptions = [
    # CC0 is a public-domain dedication. tiny-keccak only runs at build time, inside the
    # const-random-macro that seeds ahash, whose compile-time-rng flurry turns on under
    # pingora-core 0.9.
    { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]

[bans]
# The graph has real duplicates today (openssl-probe 0.1/0.2, zstd 0.13/0.14, zstd-safe 7/8,
# r-efi 5/6, three windows-sys, two thiserror, two getrandom). Warn until they are triaged.
multiple-versions = "warn"
wildcards = "deny"
# `gapura-core = { path = "../gapura-core" }` has no version, which is right for a workspace member
# that is never published.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
