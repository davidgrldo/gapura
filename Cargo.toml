[workspace]
resolver = "3"
members = ["crates/gapura-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
base64 = "0.22"
insta = { version = "1", features = ["yaml"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
