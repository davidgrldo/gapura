[workspace]
resolver = "3"
members = ["crates/gapura-core", "crates/gapura", "crates/gapura-control"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
bcrypt = "0.15"
hmac = "0.12"
sha2 = "0.10"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
base64 = "0.22"
insta = { version = "1", features = ["yaml"] }
proptest = "1"
regex = "1.13"
pingora = { version = "0.8", features = ["proxy", "openssl"] }
async-trait = "0.1"
arc-swap = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
http = "1"
prometheus = "0.13"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
# Postgres for the control plane's store (ADR 2). tokio-postgres rather than sqlx: the
# compile-time query checking sqlx buys costs a committed .sqlx directory that has to be
# regenerated in step with every migration, and this workspace would rather carry the checking
# in tests than carry that in CI. deadpool is the pool, because a single connection that dies
# takes the configuration endpoint down until a restart.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["v4", "serde"] }
deadpool-postgres = "0.14"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rcgen = "0.13"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Dependencies without debuginfo: their rlibs shrink to a fraction and builds get faster.
# Workspace crates keep full debuginfo for backtraces.
[profile.dev.package."*"]
debug = false
