# Cluster for the in-cluster tests and for conformance: host ports 80 and 443 reach the NodePorts
# the chart uses, so Gateway.status.addresses can be 127.0.0.1 and a Gateway listener on port 80
# is dialable from the host. Gateway API conformance requires exactly that.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - { containerPort: 30080, hostPort: 80, listenAddress: 127.0.0.1, protocol: TCP }
  - { containerPort: 30443, hostPort: 443, listenAddress: 127.0.0.1, protocol: TCP }
  # The second conformance Gateway's address: 127.0.0.2 is a free loopback alias, so the suite
  # can dial two distinct addresses on port 80 and reach two distinct Gateways. The first
  # mapping pins 127.0.0.1 explicitly — two bindings on host port 80 may only differ in
  # address, and a 0.0.0.0 binding would swallow the 127.0.0.2 one.
  - { containerPort: 30081, hostPort: 80, listenAddress: 127.0.0.2, protocol: TCP }
