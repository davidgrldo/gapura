    <h1>Data flow: the request path and the config reload path</h1>

      <title id="gapura-reload-title">Gapura v0.1: config reload path from a Kubernetes event</title>
      <desc id="gapura-reload-desc">Sequence diagram: a watch event from the API server reaches the reconciler, is debounced for 200 milliseconds, and is turned by the pure translator into a Config and status patches; the Config is swapped atomically into the store, and only the leader replica writes status back to the API server.</desc>
