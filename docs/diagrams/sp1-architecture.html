<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gapura SP1 · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Gapura SP1 · v0.1</p>
    <h1>One binary: kube-rs control plane and Pingora data plane</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gapura-arch-title gapura-arch-desc">
      <title id="gapura-arch-title">Gapura v0.1: single-binary runtime architecture</title>
      <desc id="gapura-arch-desc">Architecture diagram of Gapura v0.1: kube-rs watchers read Gateway API resources from the API server, a pure translator produces a Config that is swapped atomically and read by the Pingora proxy on every request, while status is written back to the API server by the leader replica.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: outer = the single binary / pod -->
      <rect x="216" y="64" width="608" height="408" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="432" y="68" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">GAPURA · ONE BINARY · N REPLICAS</text>

      <!-- Zone: inner = control plane -->
      <rect x="232" y="88" width="576" height="232" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="456" y="92" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">CONTROL PLANE · KUBE-RS</text>

      <!-- Arrows (before nodes) -->
      <!-- 1. API server -> Watchers -->
      <line x1="184" y1="152" x2="248" y2="152" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 2. Watchers -> Translator -->
      <line x1="376" y1="152" x2="424" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3. Translator -> Config store (primary) -->
      <line x1="584" y1="152" x2="640" y2="152" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 4. Translator bottom -> Status writer top (two-bend elbow, mid y=208) -->
      <path d="M 504,184 V 200 Q 504,208 496,208 H 320 Q 312,208 312,216 V 232"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5. Status writer left -> API server bottom -->
      <path d="M 248,264 H 120 Q 112,264 112,256 V 184"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 6. Config store bottom -> Proxy top (per-request lock-free read, passive) -->
      <line x1="712" y1="184" x2="712" y2="376" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 7. Client -> Proxy -->
      <line x1="184" y1="408" x2="640" y2="408" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 8. Proxy -> Backends -->
      <line x1="784" y1="408" x2="848" y2="408" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels (masked, 6-10px above stroke) -->
      <rect x="196" y="132" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="141" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WATCH</text>

      <rect x="380" y="132" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENTS</text>

      <rect x="596" y="132" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="141" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SWAP</text>

      <rect x="376" y="188" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONDITIONS</text>

      <rect x="144" y="244" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="184" y="253" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PATCH STATUS</text>

      <rect x="720" y="272" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="736" y="281" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>

      <rect x="280" y="388" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="397" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <rect x="800" y="388" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="816" y="397" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>

      <!-- Node: Kubernetes API server (external) -->
      <rect x="40" y="120" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="120" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="48" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="62" y="137" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
      <text x="112" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API server</text>
      <text x="112" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Gateway API CRDs</text>

      <!-- Node: Watchers -->
      <rect x="248" y="120" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="120" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="256" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="270" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
      <text x="312" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Watchers</text>
      <text x="312" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reflectors · debounce</text>

      <!-- Node: Translator (focal) -->
      <rect x="424" y="120" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="424" y="120" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="432" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="446" y="137" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="504" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Translator</text>
      <text x="504" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pure fn · resources → Config</text>

      <!-- Node: Config store -->
      <rect x="640" y="120" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="120" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="648" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="662" y="137" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEM</text>
      <text x="712" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Config store</text>
      <text x="712" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ArcSwap&lt;Config&gt;</text>

      <!-- Node: Status writer -->
      <rect x="248" y="232" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="232" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="256" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="270" y="249" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="312" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Status writer</text>
      <text x="312" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">leader only · Lease</text>

      <!-- Node: Client (input) -->
      <rect x="40" y="376" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="376" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="384" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="393" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="112" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="112" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser · curl · app</text>

      <!-- Node: Pingora proxy -->
      <rect x="640" y="376" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="376" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="648" y="384" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="666" y="393" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
      <text x="712" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pingora proxy</text>
      <text x="712" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ProxyHttp · :80 · :443</text>

      <!-- Node: Backend pods (external) -->
      <rect x="848" y="376" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="848" y="376" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="856" y="384" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="870" y="393" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
      <text x="912" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend pods</text>
      <text x="912" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EndpointSlice IPs</text>

      <!-- Legend strip -->
      <line x1="40" y1="496" x2="960" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="524" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / pure logic</text>

      <rect x="176" y="524" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="196" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">In-process component</text>

      <rect x="336" y="524" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="356" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">In-memory state</text>

      <rect x="472" y="524" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="492" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cluster / external</text>

      <rect x="608" y="524" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="628" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Client</text>

      <line x1="688" y1="530" x2="716" y2="530" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="724" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API call</text>

      <line x1="816" y1="530" x2="844" y2="530" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="852" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Hot swap</text>

      <line x1="916" y1="530" x2="944" y2="530" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="952" y="532" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Read</text>
    </svg>
  </div>
</body>
</html>
