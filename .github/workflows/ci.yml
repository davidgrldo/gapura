name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # The configuration endpoint's tests run against a real Postgres rather than a mock, so the
    # thing under test is the thing that ships. They refuse to skip when CI is set, which is
    # what stops a typo here from producing a green build that exercised nothing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          GAPURA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # rust-toolchain.toml pins `stable`, which would silently win over the installed 1.89.
      - run: cargo check --workspace --all-targets --locked
        env:
          RUSTUP_TOOLCHAIN: "1.89"

  console:
    runs-on: ubuntu-latest
    # The console's own guard, web/check.mjs: it fails a build whose page cannot show every state
    # the API can report, or that asks a third party for anything. The image jobs only build the
    # console, so without this nothing ran it. From a checkout rather than inside an image,
    # because the check reads the route states from the Rust enum in crates/.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The version Dockerfile.control builds the console with.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build && npm run check
        working-directory: web

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          # Pinned: the golden renders were produced by this version, and a helm release that
          # changes rendering would fail this job for reasons unrelated to the chart.
          version: v4.1.4
      - run: ./hack/check-identity.sh
      - run: ./hack/chart-render.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: gapura:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm gapura:ci --version

  console-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          # The console's backend is a separate image: the data plane above faces the internet
          # and has no business carrying browser assets, and appending stages to its Dockerfile
          # would make the last one the default target of a bare `docker build .`.
          file: Dockerfile.control
          push: false
          load: true
          tags: gapura-control:ci
          # Its own scope, so the two images do not evict each other's layers from one cache.
          cache-from: type=gha,scope=control
          cache-to: type=gha,mode=max,scope=control
      # `--help` rather than the data plane's `--version`: this package's clap command declares
      # no version. Either way the point is to catch a binary that compiled but cannot start.
      - run: docker run --rm gapura-control:ci --help
