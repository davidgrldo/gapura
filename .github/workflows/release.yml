name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to build, e.g. v0.1.0
        required: true
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Two images, same treatment: the data plane and the console each build per arch,
        # push by digest, carry provenance and an SBOM, and are joined below. Two images is
        # a decision recorded in #63 -- the data plane faces the internet and does not carry
        # browser assets, and the console carries them and nothing else.
        include:
          - component: gateway
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
            image: ghcr.io/${{ github.repository }}
            file: Dockerfile
          - component: gateway
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            image: ghcr.io/${{ github.repository }}
            file: Dockerfile
          - component: control
            platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
            image: ghcr.io/${{ github.repository }}-control
            file: Dockerfile.control
          - component: control
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            image: ghcr.io/${{ github.repository }}-control
            file: Dockerfile.control
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          # Push by digest; the tags are attached by the merge job below.
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Attestations ride along free with push-by-digest, and a project with no edition to
          # buy should not need one to verify what it runs: provenance mode=max carries the
          # source repo, commit and builder identity, and the SBOM is the dependency list a
          # verifier needs. Neither survives loading into the runner's docker, which is why the
          # ci.yml image job stays without them.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      # Job-level `outputs` are not merged across matrix legs: each leg records the whole map from
      # its own context, so one arch's digest always comes back empty. Hand the digests over as
      # per-leg artifacts instead, the way Docker's own multi-platform guide does.
      - run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        component: [gateway, control]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.component == 'control' && '-control' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the version under release
        # Same resolution the chart job uses. The semver patterns below read the git ref, which
        # a workflow_dispatch run never carries -- its ref is a branch -- so a dispatch release
        # tagged only sha-<commit> and the chart's appVersion default pointed at a tag that was
        # never published (#72). The raw tag publishes the version the dispatch was asked for;
        # on a tag push it duplicates the semver one, which imagetools create applies idempotently.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then version="${{ github.event.inputs.tag }}"; version="${version#v}"; fi
          echo "version=$version" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,${{ env.version }}
            type=sha,format=long
      - uses: actions/download-artifact@v7
        with:
          # Scoped to this component's legs only: the gateway and the console are separate
          # images, and a bare digest-* here would join four legs into two mixed manifests.
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true
          path: /tmp/digests
      - name: Join the per-arch digests into one manifest list
        run: |
          set -euo pipefail
          tags=$(jq -r '.tags | map("--tag " + .) | join(" ")' <<<'${{ steps.meta.outputs.json }}')
          # An unmatched glob would pass through literally and printf would still emit "$IMAGE@",
          # so check the directory itself before trusting the refs.
          test -n "$(ls -A /tmp/digests 2>/dev/null)"
          refs=$(for f in /tmp/digests/*; do printf '%s@%s ' "$IMAGE" "$(cat "$f")"; done)
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $refs
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.1.4
      - run: ./hack/chart-render.sh
      - name: Package and push the chart
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then version="${{ github.event.inputs.tag }}"; version="${version#v}"; fi
          helm package charts/gapura --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          # helm push appends the chart name, so the remote is the parent path.
          helm push "gapura-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  # The GitHub release object: the tag exists and the packages are pushed by the jobs above, but
  # without this the Releases page stays empty, and adopters judge maturity from that page. Notes
  # are the CHANGELOG section for the version; the conformance report rides along as an asset.
  # Idempotent on re-run: a re-run of the release workflow finds the release and re-uploads.
  notes:
    needs: chart
    # A dispatch builds a branch and creates no tag, so there is no tag to hang a release on
    # and `gh release create --verify-tag` refuses, correctly. Publishing the image and the
    # chart is the whole point of that path, so let it finish green instead of red.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then version="${{ github.event.inputs.tag }}"; version="${version#v}"; fi
          body="$(awk -v v="$version" '
            !p && $0 ~ "^## "v"([[:space:]]|$)" {p=1; next}
            p && /^## / {exit}
            p {print}
          ' CHANGELOG.md)"
          # Stop here when CHANGELOG.md has no section for this version, rather than after
          # assembling the file: the boilerplate below writes list items of its own, so any
          # check on the finished notes is satisfied by this step's own output and a release
          # with an empty "What changed" sails through.
          if [ -z "${body//[[:space:]]/}" ]; then
            echo "CHANGELOG.md has no '## ${version}' section to release from" >&2
            exit 1
          fi
          {
            echo "## What changed"
            echo
            printf '%s\n\n' "$body"
            echo "## Packages"
            echo
            echo "- Image: ghcr.io/davidgrldo/gapura:${version} (linux/amd64, linux/arm64)"
            echo "- Chart: oci://ghcr.io/davidgrldo/charts/gapura, version ${version}"
            echo
            echo "Verify the install the way a stranger would, with no ghcr credentials: the"
            echo "quickstart workflow does exactly that on every release."
          } > /tmp/notes.md
          head -5 /tmp/notes.md
      - name: Create the release, attach the conformance report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then version="${{ github.event.inputs.tag }}"; version="${version#v}"; fi
          tag="v${version}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --verify-tag --title "gapura v${version}" --notes-file /tmp/notes.md
          # The report file name embeds the version it was run for; older releases carry none.
          shopt -s nullglob
          reports=(conformance/reports/*/*/*v"${version}"-*.yaml)
          if [ "${#reports[@]}" -gt 0 ]; then
            gh release upload "$tag" --clobber "${reports[@]}"
          else
            echo "no conformance report matching v${version}; skipping the asset"
          fi
