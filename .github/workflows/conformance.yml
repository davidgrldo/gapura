name: conformance
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  gateway-http:
    if: github.event_name != 'pull_request' || github.event.label.name == 'conformance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: azure/setup-helm@v5
        with:
          version: v4.1.4
      - uses: docker/setup-buildx-action@v4
      # kind is not preinstalled on the runner image; kubectl and docker are.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      # Green here means "the tests that failed are exactly the ones expected to", not "nothing
      # failed": HTTPRouteMultipleGateways fails by construction and is pinned, with the reason, as
      # EXPECTED_FAILURES at the top of hack/conformance.sh. Any other test failing turns this job
      # red, and so does that one starting to pass. The suite itself is run at full strength.
      - name: Run the suite
        run: ./hack/conformance.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: conformance/reports/**/*.yaml
          if-no-files-found: warn
